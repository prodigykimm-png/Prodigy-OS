  <title>Todo 15 LLM Wiki controller-backed product surface QA</title>
  <style>
    :root {
      --background-primary: Canvas;
      --background-secondary: ButtonFace;
      --background-modifier-hover: SelectedItem;
      --background-modifier-border: GrayText;
      --text-normal: CanvasText;
      --text-muted: GrayText;
      --text-accent: LinkText;
      --text-error: MarkText;
      --interactive-accent: Highlight;
      --text-on-accent: HighlightText;
      --ke-color-surface: var(--background-primary);
      --ke-color-surface-secondary: var(--background-secondary);
      --ke-color-hover: var(--background-modifier-hover);
      --ke-color-border: var(--background-modifier-border);
      --ke-color-text: var(--text-normal);
      --ke-color-muted: var(--text-muted);
      --ke-color-accent: var(--text-accent);
      --ke-color-error: var(--text-error);
      --ke-color-interactive: var(--interactive-accent);
      --ke-color-on-interactive: var(--text-on-accent);
      --ke-space-1: 2px;
      --ke-space-2: 4px;
      --ke-space-3: 8px;
      --ke-space-4: 12px;
      --ke-space-5: 16px;
      --ke-border-width: 1px;
      --ke-focus-ring-width: 2px;
      --ke-radius-control: 4px;
      --ke-radius-panel: 8px;
      --ke-font-weight-strong: 600;
      --ke-opacity-disabled: .6;
      --ke-metadata-label-min: 7rem;
      --ke-type-label: .72rem;
      --ke-type-body: .84rem;
      --ke-type-heading: .92rem;
      --ke-type-title: 1.05rem;
      --ke-leading-body: 1.45;
      --ke-leading-control: 1.35;
      --ke-touch-target: 44px;
      --ke-motion-fast: 150ms;
    }
    html, body { margin: 0; min-inline-size: 0; background: var(--ke-color-surface); color: var(--ke-color-text); }
    body { padding: var(--ke-space-5); font-family: system-ui, sans-serif; }
    .qa-shell { max-inline-size: 64rem; min-inline-size: 0; }
    .qa-contract { margin: 0 0 var(--ke-space-4); color: var(--ke-color-muted); overflow-wrap: anywhere; word-break: keep-all; }
    #qa-receipt { display: block; margin-block-start: var(--ke-space-4); font-size: var(--ke-type-label); overflow-wrap: anywhere; word-break: keep-all; }
  </style>
</head>
<body>
  <div class="qa-shell" data-fixture-kind="controller-backed-product-surface" data-product-e2e="true">
    <p class="qa-contract">Controller-backed 제품 surface QA · 합성 source · 외부 provider/network/Vault/Git/persistence write 없음</p>
    <div id="tabs"></div>
    <output id="qa-receipt" aria-live="polite"></output>
  </div>
  <script src="../../../../../Views/design-tokens.js"></script>
  <script src="../../../../../Views/llmwiki-hash.js"></script>
  <script>
    class FixtureBuffer extends Uint8Array {}
    window.Buffer = Object.freeze({
      isBuffer(value) { return value instanceof FixtureBuffer; },
      from(value) { return new FixtureBuffer(new TextEncoder().encode(String(value ?? ""))); }
    });
    window.require = (name) => {
      if (name === "node:crypto") return { createHash() { let bytes = ""; return { update(value) { bytes = value instanceof Uint8Array ? new TextDecoder().decode(value) : String(value); return this; }, digest() { return LLMWikiHash.sha256(bytes); } }; } };
      if (name === "node:fs/promises") return Object.freeze({});
      if (name === "node:path") return Object.freeze({});
      throw new Error(`Fixture dependency unavailable: ${name}`);
    };
  </script>
