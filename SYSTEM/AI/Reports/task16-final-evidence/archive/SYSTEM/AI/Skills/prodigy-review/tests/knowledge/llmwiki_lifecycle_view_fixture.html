<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Todo 13 LLM Wiki lifecycle fixture</title>
  <style>
    :root {
      --background-primary: Canvas;
      --background-secondary: ButtonFace;
      --background-modifier-hover: SelectedItem;
      --background-modifier-border: GrayText;
      --text-normal: CanvasText;
      --text-muted: GrayText;
      --text-accent: LinkText;
      --text-error: MarkText;
      --interactive-accent: Highlight;
      --text-on-accent: HighlightText;
      --ke-color-surface: var(--background-primary);
      --ke-color-surface-secondary: var(--background-secondary);
      --ke-color-hover: var(--background-modifier-hover);
      --ke-color-border: var(--background-modifier-border);
      --ke-color-text: var(--text-normal);
      --ke-color-muted: var(--text-muted);
      --ke-color-accent: var(--text-accent);
      --ke-color-error: var(--text-error);
      --ke-color-interactive: var(--interactive-accent);
      --ke-color-on-interactive: var(--text-on-accent);
      --ke-space-1: 2px;
      --ke-space-2: 4px;
      --ke-space-3: 8px;
      --ke-space-4: 12px;
      --ke-space-5: 16px;
      --ke-border-width: 1px;
      --ke-focus-ring-width: 2px;
      --ke-radius-control: 4px;
      --ke-radius-panel: 8px;
      --ke-font-weight-strong: 600;
      --ke-opacity-disabled: .6;
      --ke-metadata-label-min: 7rem;
      --ke-type-label: .72rem;
      --ke-type-body: .84rem;
      --ke-type-heading: .92rem;
      --ke-type-title: 1.05rem;
      --ke-leading-body: 1.45;
      --ke-leading-control: 1.35;
      --ke-touch-target: 44px;
    }
    html, body { margin: 0; min-inline-size: 0; background: var(--ke-color-surface); color: var(--ke-color-text); }
    body { padding: var(--ke-space-5); font-family: system-ui, sans-serif; }
    .fixture-controls { display: flex; flex-wrap: wrap; gap: var(--ke-space-2); margin-block-end: var(--ke-space-4); min-inline-size: 0; }
    .fixture-controls button { min-block-size: var(--ke-touch-target); padding: var(--ke-space-2) var(--ke-space-3); }
    #surface { inline-size: min(100%, 48rem); min-inline-size: 0; }
    #trace { margin-block-start: var(--ke-space-4); font-size: var(--ke-type-label); overflow-wrap: anywhere; word-break: keep-all; }
  </style>
</head>
<body>
  <nav class="fixture-controls" aria-label="합성 상태 전환">
    <button type="button" data-fixture-state="idle">빈 상태</button>
    <button type="button" data-fixture-state="review">검토 상태</button>
    <button type="button" data-fixture-state="stale_reconfirm_required">오래된 검토</button>
    <button type="button" data-fixture-state="committed_audit_pending">감사 복구</button>
    <button type="button" data-fixture-state="committed_refresh_failed">새로고침 복구</button>
    <button type="button" data-action="approve-create" hidden>새 지식 승인</button>
  </nav>
  <main id="surface"></main>
  <output id="trace" hidden>controller trace: []</output>
  <script src="../../../../../Views/design-tokens.js"></script>
  <script src="../../../../../Views/llmwiki-hash.js"></script>
  <script src="../../../../../Views/llmwiki-proposal-bundle.js"></script>
  <script src="../../../../../Views/llmwiki-approval-packet.js"></script>
  <script src="../../../../../Views/knowledge-explorer-hub-adapter.js"></script>
  <script src="../../../../../Views/llmwiki-approval-review-commit.js"></script>
  <script src="../../../../../Views/llmwiki-approval-review-view.js"></script>
  <script src="../../../../../Views/llmwiki-lifecycle-view.js"></script>
  <script>
    const surface = document.querySelector("#surface");
    const trace = document.querySelector("#trace");
    const approveCreate = document.querySelector('[data-action="approve-create"]');
    const actionTrace = [];
    const forbiddenCalls = { persistence: 0, provider: 0, network: 0, vault: 0, git: 0 };
    const forbiddenCapabilityNames = Object.keys(forbiddenCalls);
    window.__task13ControllerTrace = actionTrace;
    const source = { selected: true, display_name: "아주 긴 한국어 자료 이름과 https://example.invalid/very-long-unbroken-source-url-without-natural-breakpoints" };
    const packet = LLMWikiApprovalReviewView.createSyntheticApprovalPacket();
    const makeSnapshot = (status) => ({
      status,
      source_selection: status === "idle" ? { selected: false, display_name: "" } : source,
      provider_mode: "direct",
      approval_packet: packet,
      packet_hash: "a".repeat(64),
      revision: "b".repeat(64),
      provider_id: "provider_fixture_only",
      links: {
        canonical: { path: "SYNTHETIC/Knowledge/a-very-long-display-only-result-path.md" },
        audit: { path: "SYNTHETIC/Audit/a-very-long-display-only-audit-path.json" },
      },
    });
    let current = "idle";
    let view;
    const renderTrace = () => {
      const apiKeys = view ? Object.keys(view).sort() : [];
      trace.textContent = JSON.stringify({
        intents: actionTrace,
        exposed_forbidden_methods: forbiddenCapabilityNames.filter((name) => apiKeys.includes(name)),
        forbidden_calls: forbiddenCalls,
        review_child_count: surface.querySelectorAll('[data-surface="llmwiki-approval-review"]').length,
      });
    };
    const setState = (status) => {
      current = status;
      if (!view) {
        view = LLMWikiLifecycleView.mountLlmWikiLifecycleView({ container: surface, snapshot: makeSnapshot(status), onAction });
      } else {
        view.update(makeSnapshot(status));
      }
      approveCreate.hidden = status !== "review";
      renderTrace();
    };
    const onAction = (intent) => {
      actionTrace.push(intent);
      if (intent.action === "select_source") setState("selecting");
      if (intent.action === "request_consent") setState("consent_required");
      if (intent.action === "start_run") setState("running");
      if (intent.action === "cancel") setState("cancelled");
      if (intent.action === "repacket_stale") setState("review");
      if (intent.action === "repair_audit" || intent.action === "retry_refresh") setState("committed");
      if (intent.action === "approve") setState("committed");
      renderTrace();
    };
    approveCreate.addEventListener("click", () => {
      const open = surface.querySelector('[data-action="open-review"]');
      if (open) open.click();
      const create = [...surface.querySelectorAll('input[data-operation-id]')]
        .find((control) => control.getAttribute("aria-label") === "추가 변경 선택");
      if (!create) throw new Error("실제 검토 child의 새 지식 선택 control을 찾지 못했습니다.");
      create.click();
      const approve = surface.querySelector('[data-action="approve-selected"]');
      if (!approve || approve.disabled) throw new Error("실제 검토 child의 선택 승인을 사용할 수 없습니다.");
      approve.click();
    });
    document.querySelectorAll("[data-fixture-state]").forEach((button) => button.addEventListener("click", () => setState(button.dataset.fixtureState)));
    setState("idle");
  </script>
</body>
</html>
