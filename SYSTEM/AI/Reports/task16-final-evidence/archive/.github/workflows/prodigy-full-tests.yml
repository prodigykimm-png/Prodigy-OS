name: Prodigy Full Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Run portable Node 24 release gate (real Obsidian is macOS-only final evidence)
        run: bash SYSTEM/CI/run-release-gate.sh
